<script id="noteBlockTemplate" type="text/x-handlebars-template">

<!-- Scripts -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.2.4/jquery.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.0.5/handlebars.js"></script>

<script>
	(function () {
		class HexGen {
			constructor(seed) {
				this.seed = seed || 0;
				this.chars = '0123456789ABCDEF';
			}

			generateHex() {
				var hexStr = '';

				for (var i = 0; i < 6; i++) {
					var randomIdx = Math.floor(Math.random() * this.chars.length);

					hexStr += this.chars[randomIdx];
				}

				return hexStr;
			}
		}

		class HandlebarsHelper {
			constructor() {

			}

			getTemplateHtml(templateId, object) {
				var source = $(templateId).html();
				var template = Handlebars.compile(source);

				return template(object);
			}
		}

		class NoteBlock {
			constructor(title, content, url, imgUrl, noteBlockTemplateId) {
				this.title = title;
				this.content = content;
				this.url = url;
				this.imgUrl = imgUrl;

				this.handlebarsHelper = new HandlebarsHelper();

				this.color = hg.generateHex();

				this.colorStyle = 'background: #' + this.color;

				this.noteBlockTemplateId = noteBlockTemplateId || '#noteBlockTemplate';
			}

			getColor() {
				return this.color;
			}

			render() {
				var html = this.handlebarsHelper.getTemplateHtml(this.noteBlockTemplateId, this);

				$('#nbArea').append(html);
			}
		}

		function addNoteBlocks() {
			// add note blocks
			var noteBlocks = [];

			/*for (var i = 0; i < 10; i++) {
				var nb = new NoteBlock('Title' + i, i * i);
				noteBlocks.push(nb);
			}*/
			let imgUrls = [
				'assets/sortable-bar-chart.png',
				'https://assets.codepen.io/285131/zeplin.svg',
				'https://assets.codepen.io/285131/github.svg',
				'https://assets.codepen.io/285131/figma.svg',
				'https://assets.codepen.io/285131/zapier.svg',
				'https://assets.codepen.io/285131/jira.svg',
				'https://assets.codepen.io/285131/slack.svg',
				'https://assets.codepen.io/285131/google-chrome.svg',
				'https://assets.codepen.io/285131/google-drive.svg'
			];

			// generate cards from dropdown list (for each list item)
			$('.dropdownList li').each(function (index, el) {
				var text = $(el).find('a').text();
				var content = $(el).find('a').data('content');
				var openUrl = $(el).find('a').prop('href');
				var imgUrl = imgUrls[Math.floor(Math.random() * imgUrls.length)]; // random

				noteBlocks.push(new NoteBlock(text, content, openUrl, imgUrl));
			});

			for (var idx in noteBlocks) {
				var nb = noteBlocks[idx];

				nb.render();
			}

		}

		function init() {
			window.hg = new HexGen(0);

			addNoteBlocks();

			// handlebars - progress bar template
			window.hbh = new HandlebarsHelper();
			var html = hbh.getTemplateHtml('#progressBarTemplate', {});
			$('#progress-bar-area').append(html);
		}


		//init function
		init();
	})();
</script>
