<!DOCTYPE html>
<meta charset="utf-8">
<style>
  path {
    stroke-linejoin: round;
    stroke-linecap: round;
  }

  .land {
    fill: #ddd;
  }

  .border {
    fill: none;
    stroke: #fff;
  }

  .graph {
    fill: none;
    stroke: #000;
  }
</style>

<body>
  <script src="https://d3js.org/d3.v3.min.js"></script>
  <script src="https://d3js.org/queue.v1.min.js"></script>
  <script src="https://d3js.org/topojson.v1.min.js"></script>
  <script>

    const width = 960;
    const height = 600;

    const projection = d3.geo.albersUsa()
      .scale(1280)
      .translate([width / 2, height / 2]);

    const path = d3.geo.path()
      .projection(projection);

    const svg = d3.select("body").append("svg")
      .attr("width",
        width)
      .attr("height", height);

    const rainbowColors = ["red", "orange", "yellow", "green", "blue", "indigo", "violet"];

    queue()
      .defer(d3.json, "us.json")
      .defer(d3.json, "us-congress-113.json") // Consider updating to a newer dataset
      .await(ready);

    function ready(error, us, congress) {
      if (error) {
        console.error("Error loading data:", error);
        return; // Handle the error more gracefully
      }

      // Process Congressional district data
      const districts = topojson.feature(congress, congress.objects.districts);
      const neighbors = topojson.neighbors(congress.objects.districts.geometries);

      districts.features.forEach(function (feature, i) {
        feature.centroid = path.centroid(feature);
        if (feature.centroid.some(isNaN)) {
          console.warn("District centroid not found:", feature);
          feature.centroid = null; // Off the map
        }

        feature.neighbors = feature.centroid ? neighbors[i]
          .filter(j => j < i && districts.features[j].centroid)
          .map(j => districts.features[j]) : [];
      });

      // Render the map
      svg.append("path")
        .attr("class", "land")
        .datum(topojson.feature(us, us.objects.land))
        .attr("d", path);

      // state lines
      svg.append("path")
        .attr("class", "border")
        .datum(topojson.mesh(congress, congress.objects.districts, (a, b) => a !== b))
        .attr("d", path)
        .style("stroke", function () {
          const randomColor = rainbowColors[Math.floor(Math.random() * rainbowColors.length)];
          return randomColor
        });

      svg.append("path")
        .attr("class", "graph")
        .datum(d3.merge(districts.features.map(a => a.neighbors.map(b => [a, b]))))
        .attr("d", d => d.map(l => {
          return "M" + l[0].centroid + "L" + l[1].centroid;
        }).join(""));
    }

    d3.select(self.frameElement).style("height", height + "px");
  </script>
</body>
